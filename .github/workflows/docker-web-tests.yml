name: Docker Build, Test and Publish

on:
  push:
    branches:
      - kubernetes-task
  pull_request:
    branches:
      - kubernetes-task

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.app
          load: true
          tags: git-task-app:latest

      - name: Run tests
        run: |
          docker run --rm git-task-app:latest

      - name: Push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.app
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/git-task-app:latest

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/git-task-web:latest

      # установка Helm
      - name: Set up Helm
        uses: azure/setup-helm@v1
        with:
          version: v3.8.1

      # упаковка Helm-чарта
      - name: Package Helm chart
        run: |
          helm package helm/test-repo-chart

      # публикация Helm-чарта в GitHub Releases
      - name: Publish Helm chart to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: helm/test-repo-chart-*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
