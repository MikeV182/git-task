name: Docker Build, Test and Publish

on:
  push:
    branches:
      - kubernetes-task
  pull_request:
    branches:
      - kubernetes-task

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.app
          load: true
          tags: git-task-app:latest

      - name: Run tests
        run: |
          docker run --rm git-task-app:latest

      - name: Push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.app
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/git-task-app:latest

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/git-task-web:latest
