apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: mikev182/test-repo-app:latest
          command: ["./build/testproj", "--gtest_output=xml:/app/test_results.xml"]
