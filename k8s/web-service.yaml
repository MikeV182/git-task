apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  selector:
    app: web
  # type: LoadBalancer требует наличия облачного провайдера (например, AWS, GCP, Azure). 
  # В Docker Desktop и kind его нет, и EXTERNAL-IP всегда будет pending.
  type: NodePort
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
