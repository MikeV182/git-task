image: docker:latest

services:
  - docker:dind

stages:
  - build
  - deploy
  - pages

variables:
  DOCKER_DRIVER: overlay2

before_script:
  - docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_PASSWORD"

build:
  stage: build
  script:
    - docker build -t $DOCKERHUB_USERNAME/$CI_PROJECT_NAME:latest .
    - docker push $DOCKERHUB_USERNAME/$CI_PROJECT_NAME:latest
  only:
    - main

deploy:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  script:
    - echo "$KUBE_CONFIG" | base64 -d > kubeconfig
    - export KUBECONFIG=$PWD/kubeconfig
    - helm upgrade --install $HELM_RELEASE_NAME ./helm-chart --set image.repository=$DOCKERHUB_USERNAME/$CI_PROJECT_NAME
  only:
    - main

pages:
  stage: pages
  image: alpine
  script:
    - mkdir -p public
    - if [ -f test_results/test_results.xml ]; then
        echo "<html><body><h1>Test Results</h1>" > public/index.html;
        cat test_results/test_results.xml >> public/index.html;
        echo "</body></html>" >> public/index.html;
      else
        echo "<html><body><h1>No test results found!</h1></body></html>" > public/index.html;
      fi
  artifacts:
    paths:
      - public
  only:
    - main
