apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: {{ .Values.app.image }}
          volumeMounts:
            - name: test-results
              mountPath: /app/test_results
          command: ["/bin/bash", "-c", "./build/testproj --gtest_output=xml:/app/test_results/test_results.xml && sleep 60"]
      volumes:
        - name: test-results
          emptyDir: {}
