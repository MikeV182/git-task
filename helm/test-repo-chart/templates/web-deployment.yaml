apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: {{ .Values.web.image }}
          volumeMounts:
            - name: test-results
              mountPath: /usr/share/nginx/html
      volumes:
        - name: test-results
          emptyDir: {}
