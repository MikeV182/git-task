apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "test-repo-chart.fullname" . }}-app
  labels:
    app.kubernetes.io/name: {{ include "test-repo-chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "test-repo-chart.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "test-repo-chart.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.app.image }}"
          volumeMounts:
            - name: test-results
              mountPath: /app/test_results
          command: ["/bin/bash", "-c", "./build/testproj --gtest_output=xml:/app/test_results/test_results.xml"]
        - name: web
          image: "{{ .Values.web.image }}"
          volumeMounts:
            - name: test-results
              mountPath: /usr/share/nginx/html
          command: ["/bin/bash", "-c", "/entrypoint.sh"]
      volumes:
        - name: test-results
          emptyDir: {}
